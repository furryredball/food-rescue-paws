<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-label="Miso the cat">
  <defs>
    <filter id="crayonMiso" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="grainMiso" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#000" opacity="0.07"/>
      <circle cx="4" cy="3" r="0.5" fill="#000" opacity="0.05"/>
      <circle cx="2" cy="5" r="0.6" fill="#fff" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- orange paper background -->
  <rect width="320" height="420" fill="#F4A261"/>
  <rect width="320" height="420" fill="url(#grainMiso)"/>

  <g filter="url(#crayonMiso)" stroke-linecap="round" stroke-linejoin="round">
    <!-- doodles matching Pip's set -->
    <path d="M34 52l8 14 14-6-8 14 12 10-16 2-2 16-10-12-16 4 8-14-10-12z" fill="#7B4DE0" stroke="#111" stroke-width="3"/>
    <path d="M256 40l6 11 12-5-7 12 10 8-14 2-1 13-9-10-13 3 7-12-8-10z" fill="#2EC4B6" stroke="#111" stroke-width="3"/>
    <path d="M42 346c0-10 18-10 18 0s-18 10-18 0" fill="none" stroke="#3D5AFE" stroke-width="4"/>
    <path d="M268 318c8-14 22-4 14 10-10 8-20-2-14-10z" fill="none" stroke="#7B4DE0" stroke-width="4"/>
    <rect x="48" y="298" width="18" height="18" rx="2" fill="none" stroke="#2EC4B6" stroke-width="3.5" transform="rotate(-10 57 307)"/>
    <rect x="252" y="96" width="16" height="16" rx="2" fill="none" stroke="#3D5AFE" stroke-width="3.5" transform="rotate(14 260 104)"/>
    <circle cx="68" cy="128" r="4" fill="#7B4DE0"/>
    <circle cx="84" cy="140" r="3" fill="#2EC4B6"/>
    <circle cx="258" cy="274" r="4" fill="#3D5AFE"/>
    <circle cx="272" cy="262" r="3" fill="#7B4DE0"/>
    <path d="M38 210c12-8 8-20 20-14" fill="none" stroke="#2EC4B6" stroke-width="3.5"/>
    <path d="M282 188c-10 12-4 22-18 16" fill="none" stroke="#7B4DE0" stroke-width="3.5"/>
    <path d="M58 368l12-8 10 10 8-12" fill="none" stroke="#3D5AFE" stroke-width="3.5"/>
    <path d="M228 366l14 6-4 12 12 2" fill="none" stroke="#2EC4B6" stroke-width="3.5"/>

    <!-- body facing front (black) -->
    <path
      d="M108 250
         c-20 20 -24 70 -10 110
         c10 28 48 40 72 38
         c30-2 64-18 70-48
         c8-40 0-84-24-104
         c-22-18 -78-18 -108 4z"
      fill="#1A1A1A"
      stroke="#111"
      stroke-width="7"
    />

    <!-- legs -->
    <path d="M128 350c-2 20 0 40 2 48c2 4 12 4 14 0c0-16-2-34 0-48z" fill="#1A1A1A" stroke="#111" stroke-width="6"/>
    <path d="M178 352c-2 20 0 40 2 48c2 4 12 4 14 0c0-16-2-34 0-48z" fill="#1A1A1A" stroke="#111" stroke-width="6"/>
    <ellipse cx="136" cy="398" rx="15" ry="8" fill="#1A1A1A" stroke="#111" stroke-width="5"/>
    <ellipse cx="186" cy="398" rx="15" ry="8" fill="#1A1A1A" stroke="#111" stroke-width="5"/>

    <!-- tail -->
    <path d="M236 290c30 8 48 36 36 58c-6 10-20 10-26 2c4-10 2-22-6-30c-6-6-10-8-16-8z" fill="#1A1A1A" stroke="#111" stroke-width="6"/>

    <!-- head -->
    <path
      d="M90 170
         c-6-52 34-96 86-98
         c52-2 92 38 90 88
         c-2 48-40 84-88 86
         c-52 2-92-30-88-76z"
      fill="#1A1A1A"
      stroke="#111"
      stroke-width="7"
    />

    <!-- pointed ears with pink inside -->
    <path d="M108 128c-8-48 10-78 34-82c10-2 16 8 14 18c-6 24-18 46-32 62z" fill="#1A1A1A" stroke="#111" stroke-width="5"/>
    <path d="M120 130c-2-30 10-52 24-56c2 20-4 42-16 56z" fill="#FF8FAB"/>
    <path d="M210 120c14-50 44-72 66-66c10 2 12 14 6 22c-18 22-40 44-58 58z" fill="#1A1A1A" stroke="#111" stroke-width="5"/>
    <path d="M222 128c10-30 30-48 46-46c-4 18-16 38-34 50z" fill="#FF8FAB"/>

    <!-- orange rings around huge eyes -->
    <ellipse cx="132" cy="176" rx="36" ry="38" fill="#F4A261" stroke="#111" stroke-width="4"/>
    <ellipse cx="198" cy="176" rx="36" ry="38" fill="#F4A261" stroke="#111" stroke-width="4"/>
    <ellipse cx="132" cy="176" rx="28" ry="30" fill="#FFF" stroke="#111" stroke-width="5"/>
    <ellipse cx="198" cy="176" rx="28" ry="30" fill="#FFF" stroke="#111" stroke-width="5"/>
    <!-- pupils looking sideways -->
    <circle cx="142" cy="180" r="13" fill="#111"/>
    <circle cx="208" cy="180" r="13" fill="#111"/>
    <circle cx="146" cy="174" r="3.5" fill="#FFF"/>
    <circle cx="212" cy="174" r="3.5" fill="#FFF"/>

    <!-- tiny orange nose + smile -->
    <ellipse cx="165" cy="208" rx="7" ry="5" fill="#F4A261" stroke="#111" stroke-width="3"/>
    <path d="M158 218c4 6 10 6 14 0" fill="none" stroke="#F4A261" stroke-width="3.5"/>

    <!-- orange whiskers -->
    <path d="M88 200c28 2 46 8 58 16" fill="none" stroke="#F4A261" stroke-width="3.5"/>
    <path d="M90 214c26 0 44 2 56 8" fill="none" stroke="#F4A261" stroke-width="3.5"/>
    <path d="M92 228c24-2 42-2 54 2" fill="none" stroke="#F4A261" stroke-width="3.5"/>
    <path d="M184 216c20-6 40-12 58-14" fill="none" stroke="#F4A261" stroke-width="3.5"/>
    <path d="M186 226c22-2 42-4 56-2" fill="none" stroke="#F4A261" stroke-width="3.5"/>
    <path d="M188 236c20 2 38 6 52 12" fill="none" stroke="#F4A261" stroke-width="3.5"/>
  </g>
</svg>
