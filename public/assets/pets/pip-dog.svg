<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-label="Pip the dog">
  <defs>
    <filter id="crayon" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#000" opacity="0.07"/>
      <circle cx="4" cy="3" r="0.5" fill="#000" opacity="0.05"/>
      <circle cx="2" cy="5" r="0.6" fill="#fff" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- yellow paper background -->
  <rect width="320" height="420" fill="#F6D84A"/>
  <rect width="320" height="420" fill="url(#grain)"/>

  <g filter="url(#crayon)" stroke-linecap="round" stroke-linejoin="round">
    <!-- doodles -->
    <path d="M28 48l8 14 14-6-8 14 12 10-16 2-2 16-10-12-16 4 8-14-10-12z" fill="#7B4DE0" stroke="#111" stroke-width="3"/>
    <path d="M250 36l6 11 12-5-7 12 10 8-14 2-1 13-9-10-13 3 7-12-8-10z" fill="#2EC4B6" stroke="#111" stroke-width="3"/>
    <path d="M40 340c0-10 18-10 18 0s-18 10-18 0" fill="none" stroke="#3D5AFE" stroke-width="4"/>
    <path d="M270 320c8-14 22-4 14 10-10 8-20-2-14-10z" fill="none" stroke="#7B4DE0" stroke-width="4"/>
    <rect x="52" y="300" width="18" height="18" rx="2" fill="none" stroke="#2EC4B6" stroke-width="3.5" transform="rotate(-12 61 309)"/>
    <rect x="248" y="92" width="16" height="16" rx="2" fill="none" stroke="#3D5AFE" stroke-width="3.5" transform="rotate(18 256 100)"/>
    <circle cx="70" cy="120" r="4" fill="#7B4DE0"/>
    <circle cx="86" cy="132" r="3" fill="#2EC4B6"/>
    <circle cx="255" cy="280" r="4" fill="#3D5AFE"/>
    <circle cx="268" cy="268" r="3" fill="#7B4DE0"/>
    <path d="M36 200c12-8 8-20 20-14" fill="none" stroke="#2EC4B6" stroke-width="3.5"/>
    <path d="M280 180c-10 12-4 22-18 16" fill="none" stroke="#7B4DE0" stroke-width="3.5"/>
    <path d="M60 360l12-8 10 10 8-12" fill="none" stroke="#3D5AFE" stroke-width="3.5"/>
    <path d="M230 360l14 6-4 12 12 2" fill="none" stroke="#2EC4B6" stroke-width="3.5"/>

    <!-- body (three-quarter side view, bright red) -->
    <path
      d="M118 250
         c-28 6 -48 34 -42 78
         c4 28 36 48 78 46
         c46-2 78-28 82-62
         c4-36 -18-62 -48-72
         c-18-6 -40-2 -70 10z"
      fill="#E53935"
      stroke="#111"
      stroke-width="7"
    />

    <!-- back leg -->
    <path d="M210 330c8 18 6 42-2 52c-4 4-12 2-14-4c2-14 4-30 0-42z" fill="#C62828" stroke="#111" stroke-width="6"/>
    <!-- front leg -->
    <path d="M150 335c4 20 2 44-6 52c-4 4-12 2-14-4c4-16 6-32 2-44z" fill="#E53935" stroke="#111" stroke-width="6"/>
    <!-- paws -->
    <ellipse cx="204" cy="382" rx="16" ry="9" fill="#E53935" stroke="#111" stroke-width="5"/>
    <ellipse cx="138" cy="384" rx="16" ry="9" fill="#E53935" stroke="#111" stroke-width="5"/>

    <!-- tail -->
    <path d="M240 280c28-8 46 8 42 28c-2 10-14 14-22 8c-6-4-4-14 2-16c-10 2-22 6-28 12" fill="#E53935" stroke="#111" stroke-width="6"/>

    <!-- head -->
    <path
      d="M96 150
         c-8-46 28-86 78-88
         c42-2 74 28 78 68
         c4 36-18 70-58 78
         c-46 8-88-14-98-58z"
      fill="#E53935"
      stroke="#111"
      stroke-width="7"
    />

    <!-- ears (black pointed, pink inside) -->
    <path d="M118 108c-10-42 8-72 28-78c8-2 14 6 12 16c-6 22-16 42-28 58z" fill="#111" stroke="#111" stroke-width="5"/>
    <path d="M128 112c-4-28 8-48 20-52c4 18-2 38-12 52z" fill="#FF8FAB"/>
    <path d="M198 96c12-44 42-62 62-58c8 2 10 12 4 20c-16 20-36 40-54 54z" fill="#111" stroke="#111" stroke-width="5"/>
    <path d="M210 104c8-28 28-42 42-40c-2 16-14 34-30 44z" fill="#FF8FAB"/>

    <!-- snout -->
    <ellipse cx="188" cy="198" rx="38" ry="28" fill="#FF6B6B" stroke="#111" stroke-width="5"/>

    <!-- huge eyes looking to the side -->
    <ellipse cx="148" cy="168" rx="28" ry="30" fill="#FFF" stroke="#111" stroke-width="5"/>
    <ellipse cx="198" cy="164" rx="30" ry="32" fill="#FFF" stroke="#111" stroke-width="5"/>
    <circle cx="158" cy="172" r="14" fill="#111"/>
    <circle cx="210" cy="168" r="15" fill="#111"/>
    <circle cx="162" cy="166" r="4" fill="#FFF"/>
    <circle cx="214" cy="162" r="4.5" fill="#FFF"/>

    <!-- black nose -->
    <ellipse cx="212" cy="198" rx="14" ry="11" fill="#111"/>
    <ellipse cx="208" cy="194" rx="3" ry="2" fill="#444"/>

    <!-- smile -->
    <path d="M178 214c10 12 28 12 38 2" fill="none" stroke="#111" stroke-width="4"/>

    <!-- cheek -->
    <ellipse cx="132" cy="198" rx="10" ry="7" fill="#FF8A80" opacity="0.85"/>
  </g>
</svg>
